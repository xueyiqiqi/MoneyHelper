version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: financial_assistant_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: financial_assistant
      MYSQL_USER: root
      MYSQL_PASSWORD: abc123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: financial_assistant_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: financial_assistant_backend
    restart: always
    depends_on:
      - mysql
      - redis
    environment:
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: abc123
      DB_NAME: financial_assistant
      REDIS_ADDR: redis:6379
      JWT_SECRET: your-secret-key
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-3-5-sonnet-20241022}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
    ports:
      - "8080:8080"

volumes:
  mysql_data:
